name: PR Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Create local.properties
        run: |
          echo "supabase.url=https://placeholder.supabase.co" > local.properties
          echo "supabase.anon_key=placeholder_anon_key_for_ci_build" >> local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Run unit tests
        run: ./gradlew :core:model:test :feature:auth:testDevDebugUnitTest --continue --stacktrace
        continue-on-error: true

      - name: Build debug APK
        run: ./gradlew assembleDevDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spark-debug-apk
          path: app/build/outputs/apk/dev/debug/*.apk
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/**/*.xml'
          retention-days: 7
