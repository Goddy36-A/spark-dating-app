name: Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create local.properties
        run: |
          echo "supabase.url=https://placeholder.supabase.co" >> local.properties
          echo "supabase.anon_key=placeholder" >> local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDevDebug --stacktrace 2>&1 | tee /tmp/gradle-output.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spark-debug-apk
          path: app/build/outputs/apk/dev/debug/*.apk

      - name: Push error log on failure
        if: failure()
        run: |
          mkdir -p ci-logs
          tail -n 400 /tmp/gradle-output.log > ci-logs/debug-build-error.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ci-logs/debug-build-error.log
          git commit -m "ci: capture debug build error log [skip ci]" || echo "nothing to commit"
          git push
