name: Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create local.properties
        run: |
          echo "supabase.url=https://placeholder.supabase.co" >> local.properties
          echo "supabase.anon_key=placeholder" >> local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Debug property resolution
        run: |
          {
          echo "--- root gradle.properties ---"
          cat gradle.properties || echo "MISSING"
          echo "--- find all gradle.properties in repo ---"
          find . -iname "gradle.properties" 2>/dev/null
          echo "--- GRADLE_USER_HOME gradle.properties ---"
          echo "GRADLE_USER_HOME=$GRADLE_USER_HOME"
          cat "$HOME/.gradle/gradle.properties" 2>/dev/null || echo "no ~/.gradle/gradle.properties"
          find / -maxdepth 6 -iname "gradle.properties" 2>/dev/null | grep -v "^/home/runner/work"
          } | tee /tmp/prop-debug.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDevDebug --stacktrace --no-daemon -Pandroid.useAndroidX=true -Pandroid.enableJetifier=false 2>&1 | tee /tmp/gradle-output.log

      - name: Find built APKs
        if: always()
        run: |
          echo "=== Searching for APK files ===" > /tmp/find-apk.log
          find . -iname "*.apk" 2>/dev/null >> /tmp/find-apk.log
          echo "=== app/build/outputs tree ===" >> /tmp/find-apk.log
          find app/build/outputs -maxdepth 5 2>/dev/null >> /tmp/find-apk.log || echo "no outputs dir" >> /tmp/find-apk.log
          cat /tmp/find-apk.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spark-debug-apk
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Push diagnostic log via API
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          tail -n 400 /tmp/gradle-output.log > /tmp/debug-build-error.log 2>/dev/null || echo "no gradle log" > /tmp/debug-build-error.log

          cat > /tmp/push_file.py << 'PYEOF'
          import sys, json, base64, urllib.request, urllib.error

          local_path, remote_path, repo, token = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]

          with open(local_path, 'rb') as f:
              content_b64 = base64.b64encode(f.read()).decode()

          api_base = f"https://api.github.com/repos/{repo}/contents/{remote_path}"
          headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github+json"}

          existing_sha = None
          req = urllib.request.Request(api_base + "?ref=main", headers=headers)
          try:
              with urllib.request.urlopen(req) as resp:
                  existing_sha = json.load(resp).get("sha")
          except urllib.error.HTTPError:
              pass

          payload = {"message": f"ci: update {remote_path} [skip ci]", "content": content_b64, "branch": "main"}
          if existing_sha:
              payload["sha"] = existing_sha

          data = json.dumps(payload).encode()
          put_req = urllib.request.Request(api_base, data=data, headers={**headers, "Content-Type": "application/json"}, method="PUT")
          try:
              with urllib.request.urlopen(put_req) as resp:
                  print(f"PUSH OK {remote_path}: {resp.status}")
          except urllib.error.HTTPError as e:
              print(f"PUSH FAILED {remote_path}: {e.code} {e.read().decode()[:300]}")
          PYEOF

          python3 /tmp/push_file.py /tmp/find-apk.log ci-logs/find-apk.log "$REPO" "$GH_TOKEN"
          python3 /tmp/push_file.py /tmp/debug-build-error.log ci-logs/debug-build-error.log "$REPO" "$GH_TOKEN"
          if [ -f /tmp/prop-debug.log ]; then
            python3 /tmp/push_file.py /tmp/prop-debug.log ci-logs/prop-debug.log "$REPO" "$GH_TOKEN"
          fi
