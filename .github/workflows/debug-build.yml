name: Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create local.properties
        run: |
          echo "supabase.url=https://placeholder.supabase.co" >> local.properties
          echo "supabase.anon_key=placeholder" >> local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Debug property resolution
        run: |
          {
          echo "--- root gradle.properties ---"
          cat gradle.properties || echo "MISSING"
          echo "--- find all gradle.properties in repo ---"
          find . -iname "gradle.properties" 2>/dev/null
          echo "--- GRADLE_USER_HOME gradle.properties ---"
          echo "GRADLE_USER_HOME=$GRADLE_USER_HOME"
          cat "$HOME/.gradle/gradle.properties" 2>/dev/null || echo "no ~/.gradle/gradle.properties"
          find / -maxdepth 6 -iname "gradle.properties" 2>/dev/null | grep -v "^/home/runner/work"
          } | tee /tmp/prop-debug.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDevDebug --stacktrace --no-daemon -Pandroid.useAndroidX=true -Pandroid.enableJetifier=false 2>&1 | tee /tmp/gradle-output.log

      - name: Find built APKs
        if: always()
        run: |
          echo "=== Searching for APK files ===" > /tmp/find-apk.log
          find . -iname "*.apk" 2>/dev/null >> /tmp/find-apk.log
          echo "=== app/build/outputs tree ===" >> /tmp/find-apk.log
          find app/build/outputs -maxdepth 5 2>/dev/null >> /tmp/find-apk.log || echo "no outputs dir" >> /tmp/find-apk.log
          cat /tmp/find-apk.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spark-debug-apk
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Push diagnostic log via API
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          tail -n 400 /tmp/gradle-output.log > /tmp/debug-build-error.log 2>/dev/null || echo "no gradle log" > /tmp/debug-build-error.log

          push_file() {
            local_path="$1"
            remote_path="$2"
            content_b64=$(base64 -w 0 "$local_path")
            existing_sha=$(curl -s -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/contents/$remote_path?ref=main" | python3 -c "import json,sys
try:
    print(json.load(sys.stdin).get('sha',''))
except Exception:
    print('')")
            if [ -n "$existing_sha" ]; then
              body=$(python3 -c "import json; print(json.dumps({'message':'ci: update $remote_path [skip ci]','content':'''$content_b64''','branch':'main','sha':'''$existing_sha'''}))")
            else
              body=$(python3 -c "import json; print(json.dumps({'message':'ci: add $remote_path [skip ci]','content':'''$content_b64''','branch':'main'}))")
            fi
            resp=$(curl -s -w "|HTTPSTATUS:%{http_code}" -X PUT -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/contents/$remote_path" -d "$body")
            echo "PUSH RESULT for $remote_path: $resp" | tail -c 500
          }

          push_file /tmp/find-apk.log ci-logs/find-apk.log
          push_file /tmp/debug-build-error.log ci-logs/debug-build-error.log
          if [ -f /tmp/prop-debug.log ]; then
            push_file /tmp/prop-debug.log ci-logs/prop-debug.log
          fi
