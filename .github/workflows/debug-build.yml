name: Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create local.properties
        run: |
          echo "supabase.url=https://placeholder.supabase.co" >> local.properties
          echo "supabase.anon_key=placeholder" >> local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDevDebug --stacktrace 2>&1 | tee /tmp/gradle-output.log

      - name: Find built APKs
        if: always()
        run: |
          echo "=== Searching for APK files ===" > /tmp/find-apk.log
          find . -iname "*.apk" 2>/dev/null >> /tmp/find-apk.log
          echo "=== app/build/outputs tree ===" >> /tmp/find-apk.log
          find app/build/outputs -maxdepth 5 2>/dev/null >> /tmp/find-apk.log || echo "no outputs dir" >> /tmp/find-apk.log
          cat /tmp/find-apk.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spark-debug-apk
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Push diagnostic log via API
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -n 400 /tmp/gradle-output.log > /tmp/debug-build-error.log 2>/dev/null || echo "no gradle log" > /tmp/debug-build-error.log
          FILE_B64=$(base64 -w 0 /tmp/find-apk.log)
          LOG_B64=$(base64 -w 0 /tmp/debug-build-error.log)
          curl -s -X PUT -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/ci-logs/find-apk.log" \
            -d "{\"message\":\"ci: find-apk diagnostics [skip ci]\",\"content\":\"$FILE_B64\",\"branch\":\"main\"}"
          curl -s -X PUT -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/ci-logs/debug-build-error.log" \
            -d "{\"message\":\"ci: build error diagnostics [skip ci]\",\"content\":\"$LOG_B64\",\"branch\":\"main\"}"
