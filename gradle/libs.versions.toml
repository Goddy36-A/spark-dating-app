[versions]
agp                     = "8.7.3"
kotlin                  = "2.0.21"
ksp                     = "2.0.21-1.0.28"
compose-bom             = "2024.12.01"
compose-compiler        = "1.5.15"
hilt                    = "2.52"
hilt-navigation         = "1.2.0"
room                    = "2.6.1"
navigation              = "2.8.4"
lifecycle               = "2.8.7"
coroutines              = "1.9.0"
serialization           = "1.7.3"
datastore               = "1.1.1"
work                    = "2.10.0"
coil                    = "2.7.0"
supabase                = "2.6.1"
ktor                    = "2.3.12"
firebase-bom            = "33.7.0"
google-services         = "4.4.2"
accompanist             = "0.36.0"
splash                  = "1.0.1"
billing                 = "7.1.1"
junit                   = "4.13.2"
junit-ext               = "1.2.1"
espresso                = "3.6.1"
mockk                   = "1.13.13"
truth                   = "1.4.4"
turbine                 = "1.2.0"
detekt                  = "1.23.7"
ktlint-gradle           = "12.1.2"

[libraries]
# Compose BOM
compose-bom                         = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui                          = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics                 = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling                  = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview          = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-junit4              = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest            = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-material3                   = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons              = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-animation                   = { group = "androidx.compose.animation", name = "animation" }
compose-foundation                  = { group = "androidx.compose.foundation", name = "foundation" }
compose-runtime                     = { group = "androidx.compose.runtime", name = "runtime" }
activity-compose                    = { group = "androidx.activity", name = "activity-compose", version = "1.9.3" }

# Lifecycle
lifecycle-viewmodel-compose         = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose           = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-runtime-ktx               = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }

# Navigation
navigation-compose                  = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# Hilt DI
hilt-android                        = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler                       = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose             = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-navigation" }
hilt-work                           = { group = "androidx.hilt", name = "hilt-work", version = "1.2.0" }
hilt-work-compiler                  = { group = "androidx.hilt", name = "hilt-compiler", version = "1.2.0" }

# Room
room-runtime                        = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx                            = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler                       = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing                        = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# DataStore
datastore-preferences               = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# WorkManager
work-runtime-ktx                    = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# Coroutines
coroutines-core                     = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android                  = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test                     = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Serialization
serialization-json                  = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# Supabase
supabase-core                       = { group = "io.github.jan-tennert.supabase", name = "supabase-kt", version.ref = "supabase" }
supabase-postgrest                  = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt", version.ref = "supabase" }
supabase-auth                       = { group = "io.github.jan-tennert.supabase", name = "gotrue-kt", version.ref = "supabase" }
supabase-realtime                   = { group = "io.github.jan-tennert.supabase", name = "realtime-kt", version.ref = "supabase" }
supabase-storage                    = { group = "io.github.jan-tennert.supabase", name = "storage-kt", version.ref = "supabase" }
supabase-functions                  = { group = "io.github.jan-tennert.supabase", name = "functions-kt", version.ref = "supabase" }

# Ktor (Supabase engine)
ktor-client-okhttp                  = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-logging                 = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktor" }

# Coil (images)
coil-compose                        = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
coil-video                          = { group = "io.coil-kt", name = "coil-video", version.ref = "coil" }

# Firebase
firebase-bom                        = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebase-bom" }
firebase-messaging                  = { group = "com.google.firebase", name = "firebase-messaging-ktx" }
firebase-crashlytics                = { group = "com.google.firebase", name = "firebase-crashlytics-ktx" }
firebase-analytics                  = { group = "com.google.firebase", name = "firebase-analytics-ktx" }

# Google Play Billing
billing-ktx                         = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billing" }

# Splash Screen
splash-screen                       = { group = "androidx.core", name = "core-splashscreen", version.ref = "splash" }

# Accompanist
accompanist-permissions             = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanist" }

# AndroidX Core
core-ktx                            = { group = "androidx.core", name = "core-ktx", version = "1.15.0" }
appcompat                           = { group = "androidx.appcompat", name = "appcompat", version = "1.7.0" }

# Testing
junit                               = { group = "junit", name = "junit", version.ref = "junit" }
junit-ext                           = { group = "androidx.test.ext", name = "junit", version.ref = "junit-ext" }
espresso-core                       = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
mockk                               = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
truth                               = { group = "com.google.truth", name = "truth", version.ref = "truth" }
turbine                             = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
arch-testing                        = { group = "androidx.arch.core", name = "core-testing", version = "2.2.0" }

[plugins]
android-application                 = { id = "com.android.application", version.ref = "agp" }
android-library                     = { id = "com.android.library", version.ref = "agp" }
kotlin-android                      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm                          = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization                = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose                      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                                 = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt                                = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
google-services                     = { id = "com.google.gms.google-services", version.ref = "google-services" }
firebase-crashlytics                = { id = "com.google.firebase.crashlytics", version = "3.0.2" }
detekt                              = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint                              = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }

[bundles]
compose                             = ["compose-ui", "compose-ui-graphics", "compose-ui-tooling-preview", "compose-material3", "compose-material-icons", "compose-animation", "compose-foundation", "compose-runtime", "activity-compose"]
lifecycle                           = ["lifecycle-viewmodel-compose", "lifecycle-runtime-compose", "lifecycle-runtime-ktx"]
supabase                            = ["supabase-core", "supabase-postgrest", "supabase-auth", "supabase-realtime", "supabase-storage", "supabase-functions"]
testing-unit                        = ["junit", "mockk", "truth", "turbine", "coroutines-test", "arch-testing"]
testing-android                     = ["junit-ext", "espresso-core", "compose-ui-test-junit4"]

